name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: PHP syntax check (Laravel examples)
        run: |
          if command -v php >/dev/null; then
            find examples/laravel -name '*.php' -print0 | xargs -0 -n1 php -l
          else
            echo "php not available; skipping"
          fi
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  e2e:
    # Fresh Laravel app + real DynamicSocket + headless Chrome (preinstalled on ubuntu-latest).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring
          tools: composer
      - run: npm ci
      - run: npm run test:e2e:setup -- "$RUNNER_TEMP/ds-laravel"
      - run: npm run test:e2e -- "$RUNNER_TEMP/ds-laravel"
        env:
          CHROME_BIN: google-chrome

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run test:docker
