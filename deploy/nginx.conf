# /etc/nginx/sites-available/dynamicsocket
# TLS terminates here; DynamicSocket listens on 127.0.0.1:6001.
# Set DS_TRUSTED_PROXIES=127.0.0.1 so per-IP limits use the real client IP.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name ws.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ws.example.com;

    ssl_certificate     /etc/letsencrypt/live/ws.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # WebSocket endpoint (DS_WS_PATH)
    location = /ws {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, do not append client-supplied values
        proxy_read_timeout 120s;   # > DS_HEARTBEAT_INTERVAL_MS
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Health checks
    location = /healthz { proxy_pass http://127.0.0.1:6001; }
    location = /readyz  { proxy_pass http://127.0.0.1:6001; }

    # Signed publish API. If Laravel runs on the same host or private network,
    # prefer calling http://127.0.0.1:6001 directly and delete this block.
    location /v1/ {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 64k;  # = DS_MAX_PUBLISH_BODY_BYTES
    }

    # Metrics stay internal.
    location / { return 404; }
}
